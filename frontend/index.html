<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f6" />
    <style>
      html { background: #f5f7f6; color-scheme: light; }
      html[data-theme='dark'] { background: #171b20; color-scheme: dark; }
    </style>
    <script>
      try {
        const theme = localStorage.getItem('cq_theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#171b20' : '#f5f7f6';
      } catch { /* Storage may be unavailable in private browsing. */ }
    </script>
    <title>Career City — Halyk</title>
    <link rel="icon" type="image/png" href="/brand/career-city-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
