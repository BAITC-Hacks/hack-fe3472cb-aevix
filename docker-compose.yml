services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aevix-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/career_quest.db
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_EMPLOYEE_ID: E0002
    container_name: aevix-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  backend-data:
